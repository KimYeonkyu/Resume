<!DOCTYPE html>
<html lang="ko" class="scroll-smooth dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JIN KIM - Environment Concept Artist Portfolio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '"Noto Sans KR"', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-[#121212] text-stone-100 font-sans min-h-screen flex flex-col selection:bg-blue-600 selection:text-white">

    <!-- ArtStation Style Header / Profile Banner -->
    <header class="bg-[#181818] border-b border-stone-800 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 sm:h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3 sm:space-x-4">
                <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center font-bold text-lg text-white shadow-lg">
                    JK
                </div>
                <div>
                    <h1 class="font-bold text-base sm:text-lg tracking-tight text-white">
                        Jin Kim
                    </h1>
                    <p class="text-[11px] sm:text-xs text-stone-400">Environment Concept Artist</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-3">
                <button onclick="openContactModal()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-semibold transition-all shadow-md flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                    <span>Contact</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Password Modal -->
    <div id="password-modal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md hidden items-center justify-center p-4">
        <div class="bg-[#181818] border border-stone-800 rounded-2xl p-6 sm:p-8 max-w-sm w-full relative shadow-2xl">
            <button onclick="closePasswordModal()" class="absolute top-4 right-4 text-stone-400 hover:text-white">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <h3 class="text-lg font-bold text-white mb-2">Protected Category</h3>
            <p class="text-xs text-stone-400 mb-6">비밀번호를 입력해주세요.</p>
            <div class="space-y-4">
                <input type="password" id="password-input" placeholder="비밀번호 입력" class="w-full px-4 py-3 bg-stone-900 border border-stone-700 rounded-xl text-xs text-white focus:outline-none focus:border-blue-500">
                <p id="password-error" class="text-xs text-red-400 hidden">비밀번호가 올바르지 않습니다.</p>
                <div class="flex gap-2">
                    <button onclick="closePasswordModal()" class="w-1/2 py-3 bg-stone-800 hover:bg-stone-700 text-stone-300 rounded-xl text-xs font-bold transition-all">취소</button>
                    <button onclick="verifyPassword()" class="w-1/2 py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold transition-all shadow-md">확인</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ArtStation Filter / Tabs -->
    <nav class="bg-[#161616] border-b border-stone-800 sticky top-16 sm:top-20 z-30 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between overflow-x-auto no-scrollbar gap-2">
            <div id="category-tabs" class="flex items-center space-x-2 shrink-0">
                <!-- Dynamically populated -->
            </div>
            <div class="text-xs text-stone-400 shrink-0 font-medium hidden sm:block">
                <span id="artwork-count" class="text-white font-bold">0</span> Artworks
            </div>
        </div>
    </nav>

    <!-- Main Grid -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 py-8 w-full">
        <div id="gallery-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5">
        </div>
    </main>

    <!-- Detail Modal -->
    <div id="detail-modal" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-md hidden items-center justify-center p-2 sm:p-6 overflow-y-auto">
        <button onclick="closeModal()" class="fixed top-4 right-4 sm:top-6 sm:right-6 text-stone-400 hover:text-white bg-stone-900/80 hover:bg-stone-800 border border-stone-700 rounded-full p-2.5 transition-all z-20 shadow-xl">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
        
        <button onclick="prevArtwork()" class="fixed left-4 sm:left-8 top-1/2 -translate-y-1/2 text-stone-300 hover:text-white bg-stone-900/80 hover:bg-stone-800 border border-stone-700 rounded-full p-3 transition-all z-20 shadow-xl">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </button>

        <button onclick="nextArtwork()" class="fixed right-4 sm:right-8 top-1/2 -translate-y-1/2 text-stone-300 hover:text-white bg-stone-900/80 hover:bg-stone-800 border border-stone-700 rounded-full p-3 transition-all z-20 shadow-xl">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </button>

        <div class="relative max-w-5xl w-full bg-[#181818] border border-stone-800 rounded-2xl overflow-hidden shadow-2xl my-auto flex flex-col max-h-[90vh]">
            <div id="modal-media-container" class="w-full bg-black flex items-center justify-center relative min-h-[350px] max-h-[60vh] overflow-hidden p-4"></div>
            <div class="w-full p-6 bg-[#1a1a1a] border-t border-stone-800 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                <div class="space-y-1">
                    <div class="flex items-center gap-3">
                        <span id="modal-category" class="text-[10px] font-bold text-blue-400 uppercase tracking-widest bg-blue-950/50 px-2.5 py-1 rounded-md border border-blue-800/40"></span>
                        <h2 id="modal-title" class="text-lg sm:text-xl font-bold text-white tracking-tight"></h2>
                    </div>
                    <p id="modal-desc" class="text-xs text-stone-400 leading-relaxed font-light mt-2 max-w-3xl"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Contact Modal -->
    <div id="contact-modal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md hidden items-center justify-center p-4">
        <div class="bg-[#181818] border border-stone-800 rounded-2xl p-6 sm:p-8 max-w-md w-full relative shadow-2xl">
            <button onclick="closeContactModal()" class="absolute top-4 right-4 text-stone-400 hover:text-white">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <h3 class="text-lg font-bold text-white mb-2">Get in Touch</h3>
            <div class="space-y-4">
                <div class="p-3 bg-stone-900 border border-stone-800 rounded-xl text-xs text-stone-300 font-mono select-all">jin.kim.art@example.com</div>
                <button onclick="closeContactModal()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold transition-all shadow-md">닫기</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-[#141414] border-t border-stone-800 py-8 text-center text-xs text-stone-500">
        <div class="max-w-7xl mx-auto px-6 flex flex-col sm:flex-row items-center justify-between gap-4">
            <p>&copy; 2026 JIN KIM. All rights reserved.</p>
        </div>
    </footer>

    <script>
        const projectsData = [
            { id: "개인작", title: "개인작", categoryKey: "개인작", items: [ { id: 1, title: "고대 사원", category: "개인작", url: "01.jpg", type: "image", desc: "고대 문명의 신비." }, { id: 2, title: "절벽 스터디", category: "개인작", url: "02.avif", type: "image", desc: "대자연 서사." } ] },
            { id: "도미니어니언", title: "도미니어니언", categoryKey: "도미니어니언", items: [ { id: 11, title: "시네마틱", category: "도미니어니언", url: "https://www.w3schools.com/html/mov_bbb.mp4", type: "video", desc: "실시간 엔진." } ] },
            { id: "워헤이븐", title: "워헤이븐", categoryKey: "워헤이븐", items: [ { id: 13, title: "공성전", category: "워헤이븐", url: "https://placehold.co/1200x800/334155/cbd5e1?text=Warhaven", type: "image", desc: "중세 전장." } ] },
            { id: "왕좌의게임", title: "왕좌의게임", categoryKey: "왕좌의게임", items: [ { id: 14, title: "윈터펠", category: "왕좌의게임", url: "https://placehold.co/1200x800/0f172a/e2e8f0?text=Winterfell", type: "image", desc: "북부 요새." } ] },
            { id: "Project MP", title: "Project MP", categoryKey: "Project MP", items: [ { id: 15, title: "전술 무기", category: "Project MP", url: "https://placehold.co/1200x800/334155/f8fafc?text=Weapon", type: "image", desc: "현대전 무기." } ] },
            { id: "Project DM", title: "Project DM", categoryKey: "Project DM", items: [ { id: 16, title: "던전", category: "Project DM", url: "https://placehold.co/18181b/a1a1aa?text=Dungeon", type: "image", desc: "다크 판타지." } ] }
        ];

        let currentCategory = "개인작";
        let currentItemIndex = 0;

        const categories = [
            { key: "개인작", name: "개인작" }, { key: "도미니어니언", name: "도미니어니언" },
            { key: "워헤이븐", name: "워헤이븐" }, { key: "왕좌의게임", name: "왕좌의게임" },
            { key: "Project MP", name: "Project MP" }, { key: "Project DM", name: "Project DM" }
        ];

        function renderTabs() {
            const container = document.getElementById('category-tabs');
            container.innerHTML = '';
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `px-4 py-2 rounded-lg text-xs font-semibold whitespace-nowrap transition-all ${currentCategory === cat.key ? 'bg-blue-600 text-white' : 'bg-[#222222] text-stone-300 hover:bg-[#2a2a2a]'}`;
                btn.textContent = cat.name;
                btn.onclick = () => { currentCategory = cat.key; renderTabs(); renderGallery(); };
                container.appendChild(btn);
            });
        }

        function renderGallery() {
            const grid = document.getElementById('gallery-grid');
            const items = projectsData.find(p => p.categoryKey === currentCategory).items;
            document.getElementById('artwork-count').textContent = items.length;
            grid.innerHTML = '';
            items.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = "group bg-[#181818] border border-stone-800 rounded-xl overflow-hidden cursor-pointer";
                card.onclick = () => openModal(item, index);
                card.innerHTML = `<div class="aspect-[16/10] overflow-hidden"><img src="${item.url}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"></div>`;
                grid.appendChild(card);
            });
        }

        function openModal(item, index) {
            currentItemIndex = index;
            updateModalContent();
            document.getElementById('detail-modal').classList.remove('hidden');
            document.getElementById('detail-modal').classList.add('flex');
        }

        function updateModalContent() {
            const items = projectsData.find(p => p.categoryKey === currentCategory).items;
            const item = items[currentItemIndex];
            document.getElementById('modal-media-container').innerHTML = item.type === 'video' ? `<video src="${item.url}" controls autoplay class="max-h-[55vh]"></video>` : `<img src="${item.url}" class="max-h-[55vh] w-auto">`;
            document.getElementById('modal-category').textContent = item.category;
            document.getElementById('modal-title').textContent = item.title;
            document.getElementById('modal-desc').textContent = item.desc;
        }

        function prevArtwork() { currentItemIndex = (currentItemIndex - 1 + projectsData.find(p => p.categoryKey === currentCategory).items.length) % projectsData.find(p => p.categoryKey === currentCategory).items.length; updateModalContent(); }
        function nextArtwork() { currentItemIndex = (currentItemIndex + 1) % projectsData.find(p => p.categoryKey === currentCategory).items.length; updateModalContent(); }
        function closeModal() { document.getElementById('detail-modal').classList.add('hidden'); document.getElementById('detail-modal').classList.remove('flex'); }
        function openContactModal() { document.getElementById('contact-modal').classList.remove('hidden'); document.getElementById('contact-modal').classList.add('flex'); }
        function closeContactModal() { document.getElementById('contact-modal').classList.add('hidden'); document.getElementById('contact-modal').classList.remove('flex'); }

        const detailModalEl = document.getElementById('detail-modal');
        detailModalEl.addEventListener('wheel', (e) => { if (Math.abs(e.deltaY) > 20) { e.deltaY > 0 ? nextArtwork() : prevArtwork(); e.preventDefault(); } }, { passive: false });
        
        window.onload = () => { renderTabs(); renderGallery(); };
    </script>
</body>
</html>
