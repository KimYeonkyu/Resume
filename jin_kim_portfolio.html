<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="portfolio-interview-url" content="https://minionion.duckdns.org/jin_kim_portfolio.html?mode=interview">
    <title>JIN KIM - Environment Concept Artist Portfolio</title>
    <link rel="stylesheet" href="./portfolio.css">
    <script type="module" src="./portfolio.js"></script>
</head>
<body>
    <section id="entrance-screen" class="entrance" aria-labelledby="entrance-title">
        <div class="entrance-card">
            <div class="monogram" aria-hidden="true">JK</div>
            <p class="eyebrow">Environment Concept Artist</p>
            <h1 id="entrance-title">Jin Kim Portfolio</h1>
            <p class="entrance-copy">열람 목적에 맞는 포트폴리오를 선택해 주세요.</p>

            <div id="entrance-actions" class="entrance-actions">
                <button id="interview-choice" class="choice choice-primary" type="button" aria-label="면접용 전체 포트폴리오">
                    <span>면접용 전체 포트폴리오</span>
                    <small>인증 후 비공개 프로젝트 포함</small>
                </button>
                <button id="public-choice" class="choice" type="button" aria-label="공개 포트폴리오">
                    <span>공개 포트폴리오</span>
                    <small>공개 작품만 둘러보기</small>
                </button>
            </div>
            <p id="entrance-status" class="form-message" role="alert" aria-live="assertive"></p>

            <form id="login-form" class="login-form" aria-label="면접용 포트폴리오 로그인" hidden>
                <button id="login-back" class="text-button login-back" type="button">선택으로 돌아가기</button>
                <label for="password-input">비밀번호</label>
                <div class="password-row">
                    <input id="password-input" name="password" type="password" autocomplete="current-password" maxlength="256" required>
                    <button class="submit-button" type="submit">확인</button>
                </div>
                <p id="login-error" class="form-message" role="alert" aria-live="polite"></p>
            </form>
        </div>
    </section>

    <div id="gallery-shell" class="site-shell" hidden>
        <header class="site-header">
            <div class="header-inner">
                <div class="identity">
                    <div class="avatar" aria-hidden="true">JK</div>
                    <div>
                        <h1 id="gallery-title" class="artist-name" tabindex="-1">Jin Kim Portfolio</h1>
                        <p class="artist-role">Environment Concept Artist</p>
                    </div>
                </div>
                <div class="header-actions">
                    <span id="access-status" class="access-status" aria-live="polite"></span>
                    <button id="relock-button" class="secondary-button" type="button" hidden>다시 잠그기</button>
                    <button id="contact-button" class="primary-button" type="button">Contact</button>
                </div>
            </div>
        </header>

        <nav class="category-nav" aria-label="작품 카테고리">
            <div class="nav-inner">
                <div id="category-tabs" class="category-tabs"></div>
                <p class="artwork-total"><strong id="artwork-count">0</strong> Artworks</p>
            </div>
        </nav>

        <main class="gallery-main">
            <div id="gallery-error" class="page-message" role="alert" hidden></div>
            <div id="gallery-grid" class="gallery-grid"></div>
        </main>

        <footer class="site-footer">
            <p>&copy; 2026 JIN KIM. All rights reserved.</p>
        </footer>
    </div>

    <div id="detail-modal" class="viewer" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
        <button id="modal-close-button" class="viewer-control viewer-close" type="button" aria-label="상세 이미지 닫기">
            <span aria-hidden="true">&times;</span>
        </button>
        <button id="previous-button" class="viewer-control viewer-previous" type="button" aria-label="이전 작품">
            <span aria-hidden="true">&#8249;</span>
        </button>
        <button id="next-button" class="viewer-control viewer-next" type="button" aria-label="다음 작품">
            <span aria-hidden="true">&#8250;</span>
        </button>
        <div id="modal-media-container" class="viewer-media"></div>
        <div id="modal-info" class="viewer-info">
            <div>
                <span id="modal-category" class="viewer-category"></span>
                <h2 id="modal-title" aria-live="polite"></h2>
                <p id="modal-description"></p>
            </div>
        </div>
    </div>

    <div id="contact-modal" class="contact-modal" role="dialog" aria-modal="true" aria-labelledby="contact-title" hidden>
        <div class="contact-card">
            <button id="contact-close-button" class="contact-close" type="button" aria-label="연락처 닫기">&times;</button>
            <h2 id="contact-title">Get in Touch</h2>
            <a href="mailto:jinkimoffice@gmail.com">jinkimoffice@gmail.com</a>
        </div>
    </div>
</body>
</html>
